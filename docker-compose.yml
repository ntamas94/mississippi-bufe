services:
  web:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped
    volumes:
      # a foglalási napló a konténer újraindítását is túlélje
      - booking-data:/var/www/html/data
    environment:
      # SMTP a foglalási e-mailekhez — töltsd ki a tárhely/szolgáltató adataival,
      # vagy hagyd üresen: akkor csak a data/foglalasok.log-ba íródik a kérés.
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "noreply@mississippibufe.hu"

volumes:
  booking-data:
